name: AI Test Review

on:
  # Every pull request: analyses only the functions that changed.
  pull_request:
  # Run manually for a baseline: ranks the whole repository and generates
  # tests for the riskiest few. Do this once when the action is first added.
  workflow_dispatch:

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: write          # lets the action commit the generated tests back
      pull-requests: write     # lets it post the report as a comment

    steps:
      - uses: actions/checkout@v4
        with:
          # Not optional. The risk model leans on bug_history and
          # commit_frequency, both read from git. With the default shallow
          # clone there is no history, every function looks brand new, and
          # everything scores LOW.
          fetch-depth: 0
          # Check out the PR branch itself rather than the merge commit, so
          # the generated tests can be pushed back to it.
          ref: ${{ github.head_ref }}

      - name: Analyse and generate tests
        uses: SenuriDis/R26-SE-038@integration/pipeline
        with:
          groq-api-key: ${{ secrets.GROQ_API_KEY }}
          path: src
          # changed-only defaults to "auto": scoped to the diff on a pull
          # request, whole repository on a manual run. Nothing to switch.
          #
          # LOW because this is a small repository. Only 1 function in 266
          # reached MEDIUM on a mature library, so the default of MEDIUM would
          # select nothing here and the run would do no work.
          min-risk-level: "LOW"
          max-functions: "3"
          commit-tests: "true"
          tests-dir: "tests/ai_generated"
